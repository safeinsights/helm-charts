
nameOverride: ""
fullnameOverride: ""

aws:
  enabled: false
  storageClass:
    name: aws-ebs-sc
    provisioner: ebs.csi.aws.com
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      csi.storage.k8s.io/fstype: xfs
      type: io1
      iopsPerGB: "50"
      encrypted: "true"
    allowedTopologies:
      - matchLabelExpressions:
          - key: topology.ebs.csi.aws.com/zone
            values:
              - us-east-1

networkPolicy:
  enabled: false

managementApp:
  memberId:
  endpoint:
    protocol: https
    host: app.safeinsights.org
    port: 443
  privateKey:
    secretName: management-app-secret
    key: private-key

setupApp:
  enabled: true
  name: setup-app
  # namespace: setup-app
  rbac:
    allowedSecretNames: []   # e.g., ["toa-api-credentials"]
    allowJobCreate: false    # set true only if your app must create batch Jobs
  serviceAccount:
    annotations:
      kubernetes.io/enforce-mountable-secrets: "true"
  persistence:
    enabled: false
    storageClassName: aws-ebs-sc
    pvcSize: 1Gi
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
    protocol: TCP
    port: 5051
    targetPort: 5051
  image:
    registry: harbor.safeinsights.org/safeinsights-public
    repository: setup-app
    # registry: harbor.safeinsights.org
    # repository: safeinsights-public/setup-app
    # Prefer digest pinning; leave tag empty when using digest
    digest: "sha256:PUT_REAL_DIGEST_HERE"
    tag: ""                    # keep empty when using digest
    # tag: 20250828-5a509a54
    # pullPolicy: Always
    pullPolicy: IfNotPresent
  workingDir: /home/node/code
  command: ["npx", "tsx", "src/scripts/poll.ts"]
  environmentVariables:
    k8sApiServer: https://kubernetes.default.svc.cluster.local
    k8sServiceAccountPath: /var/run/secrets/kubernetes.io/serviceaccount
    harborPullSecret: si-docker-config
    toaApiIUrl: http://toa-svc:5050
    pollIntervall: "60000"
trustedOutputApp:
  enabled: true
  name: toa
  persistence:
    enabled: false
    storageClassName: aws-ebs
    pvcSize: 1Gi
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
    protocol: TCP
    port: 5050
    targetPort: 3002
  image:
    registry: harbor.safeinsights.org/safeinsights-public
    repository: trusted-output-app
    digest: "sha256:PUT_REAL_DIGEST_HERE"
    tag: ""                    # keep empty when using digest
    # tag: 20250728-a5d087fc
    # pullPolicy: Always
    pullPolicy: IfNotPresent
  workingDir: /home/node/app
  command: ["npm", "run", "start"]
  environmentVariables:
    httpBasicAuth: admin:admin
researchContainer:
  name: research

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}

securityContext:
  {}

ingress:
  enabled: false
  className: ""
  annotations:
    {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector:
  {}
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
