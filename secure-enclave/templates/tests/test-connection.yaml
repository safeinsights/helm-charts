apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "secure-enclave.fullname" . }}-test-connection"
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-toa
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Testing connection to Trusted Output App..."
          wget --spider --timeout=5 {{ .Values.trustedOutputApp.name }}-svc:{{ .Values.trustedOutputApp.service.port }}
    - name: test-setup-app
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Testing connection to Setup App..."
          wget --spider --timeout=5 {{ .Values.setupApp.name }}-svc:{{ .Values.setupApp.service.port }}
  restartPolicy: Never
