{{- if or .Values.gcp.enabled .Values.aws.enabled -}}
# Dedicated ServiceAccount the research Jobs run under (set by setup-app via
# RESEARCH_SERVICE_ACCOUNT). On GKE it is annotated for Workload Identity so — and only so —
# the research container can impersonate the BigQuery-reader GSA. On EKS it carries the IRSA
# role-arn annotation when aws.irsa.researchRoleArn is set (otherwise research data access is
# network-level only). The default KSA and setup-app-sa are intentionally NOT annotated and
# have no cloud data access.
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if .Values.gcp.enabled }}
  name: {{ .Values.gcp.workloadIdentity.researchServiceAccountName }}
  {{- else }}
  name: {{ (.Values.aws.irsa | default dict).researchServiceAccountName | default "research-sa" }}
  {{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
  {{- if .Values.gcp.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "gcp.workloadIdentity.researchGsaEmail is required when gcp.enabled" .Values.gcp.workloadIdentity.researchGsaEmail }}
  {{- else if (.Values.aws.irsa | default dict).researchRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aws.irsa.researchRoleArn | quote }}
  {{- end }}
{{- end }}
