{{- if .Values.networkPolicy.enabled -}}
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.researchContainer.name }}-network-policy  
  annotations:
    description: "Research Container"
    version: "3.0.0-self-contained"
    architecture: "self-contained-dns"
    compliance: "management-api-audit-enabled"
    {{- if .Values.networkPolicy.logging }}
    logging: "enabled"
    {{- end }}
spec:
  # Match the label that real research Job pods actually carry (component=research-container,
  # set by setup-app). The previous selector role=="research" only matched the post-install
  # test pod, so this policy never governed real research containers. Fixes a latent isolation
  # gap and is required for the GCP BigQuery egress rule below to apply to research pods.
  selector: component == "research-container"
  order: 10
  types:
    - Egress
  egress:
    {{- include "secure-enclave.dnsEgressRules" . | nindent 4 }}

    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name in { "{{ .Release.Namespace }}" }
        selector: app == "{{ .Values.trustedOutputApp.name }}"
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort }}

    {{- if .Values.aws.enabled }}
    # AWS: data-path egress for the research container. On EKS the research pod reads its data
    # sources directly (RDS/Postgres, Redshift, S3 via the gateway endpoint), each of which is a
    # destination CIDR + port allowed here. Mirrors the GCP block below; the list is empty by
    # default, so this emits nothing unless aws.researchEgressCidrs is populated.
    {{- range .Values.aws.researchEgressCidrs }}
    - action: Allow
      protocol: {{ .protocol | default "TCP" }}
      destination:
        nets:
          - {{ .cidr }}
        ports:
          - {{ .port }}
    {{- end }}
    {{- end }}

    {{- if .Values.gcp.enabled }}
    # GCP: allow the research pod to reach the node-local GKE metadata server so it can mint
    # its Workload Identity (BigQuery-reader) token. Required under the default-deny Calico
    # policy; destinations are link-local only.
    - action: Allow
      protocol: TCP
      destination:
        nets:
          {{- range .Values.gcp.metadataServer.cidrs }}
          - {{ . }}
          {{- end }}
        ports:
          {{- range .Values.gcp.metadataServer.ports }}
          - {{ . }}
          {{- end }}

    # GCP: allow HTTPS to the Google APIs VIP so the research container can reach BigQuery via
    # Private Google Access. This is the ONLY external (non-link-local) egress it is granted.
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ .Values.gcp.privateGoogleAccess.restrictedCidr }}
          {{- if .Values.gcp.privateGoogleAccess.privateCidr }}
          - {{ .Values.gcp.privateGoogleAccess.privateCidr }}
          {{- end }}
        ports:
          - 443
    {{- end }}

{{- end}}