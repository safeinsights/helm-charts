{{- if and .Values.externalSecretsEnabled .Values.internalAuth.enabled }}
---
# ExternalSecret for Admin Namespace (Setup App & TOA)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.internalAuth.k8sSecretName | default "internal-auth-credentials" }}
  namespace: {{ .Values.adminNamespace | default "enclave-admin-ns" }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.internalAuth.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "aws-sm" }}
  target:
    name: {{ .Values.internalAuth.k8sSecretName | default "internal-auth-credentials" }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: HTTP_BASIC_AUTH
      remoteRef:
        key: {{ .Values.internalAuth.awsSecretName | default "prod/enclave/internal-auth" }}
        property: httpBasicAuth
    - secretKey: TOA_BASIC_AUTH
      remoteRef:
        key: {{ .Values.internalAuth.awsSecretName | default "prod/enclave/internal-auth" }}
        property: httpBasicAuth
    - secretKey: TOA_SIGNING_KEY
      remoteRef:
        key: {{ .Values.internalAuth.awsSecretName | default "prod/enclave/internal-auth" }}
        property: signingKey
---
# ExternalSecret for Research Namespace
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.internalAuth.k8sSecretName | default "internal-auth-credentials" }}
  namespace: {{ .Values.researchNamespace | default "enclave-research-ns" }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.internalAuth.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "aws-sm" }}
  target:
    name: {{ .Values.internalAuth.k8sSecretName | default "internal-auth-credentials" }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: TOA_BASIC_AUTH
      remoteRef:
        key: {{ .Values.internalAuth.awsSecretName | default "prod/enclave/internal-auth" }}
        property: httpBasicAuth
{{- end }}
