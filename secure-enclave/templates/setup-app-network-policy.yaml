{{- if .Values.networkPolicy.enabled }}
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.setupApp.name }}-network-policy
  annotations:
    description: "Setup app - orchestration and lifecycle management"
    version: "3.0.0-self-contained"
    architecture: "self-contained-dns"
    compliance: "management-api-audit-enabled"
    {{- if .Values.networkPolicy.logging }}
    logging: "enabled"
    {{- end }}
spec:
  selector: app == "{{ .Values.setupApp.name }}"
  order: 10
  types:
    - Ingress
    - Egress
  
  ingress:
    {{- if .Values.setupApp.service.targetPort }}
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name in { "{{ .Release.Namespace }}" }
      destination:
        ports:
          - {{ .Values.setupApp.service.targetPort }}
    {{- end }}
  
  egress:
    {{- include "secure-enclave.dnsEgressRules" . | nindent 4 }}

    # ========================================
    # EGRESS TO: Trusted Output App
    # ========================================
    {{- if .Values.trustedOutputApp.enabled }}
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name in { "{{ .Release.Namespace }}" }
        selector: app == "{{ .Values.trustedOutputApp.name }}"
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort }}
    {{- end }}
    
    # ========================================
    # EGRESS TO: Kubernetes API endpoints  
    # ========================================
    - action: Allow
      protocol: TCP
      destination:
        nets: [{{ include "secure-enclave.svcCidr" . | quote }}]
        ports:
          - 443
      {{- if .Values.networkPolicy.logging }}
      metadata:
        annotations:
          log: "true"
          log-prefix: "SETUP-MGMT-API"
          destination: "management-app"
          destination-cidr: {{ include "secure-enclave.svcCidr" . | quote }}
          compliance: "audit-required"
      {{- end }}
    
    # ========================================
    # EGRESS TO: Kubernetes API (if enabled)
    # ========================================
    {{- $svc := lookup "v1" "Service" "default" "kubernetes" -}}
    {{- if $svc }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ printf "%s/32" $svc.spec.clusterIP }}
        ports:
          - 443
    {{- end }}

    # ========================================
    # EGRESS TO: private GKE control plane (post-DNAT target of the kubernetes service).
    # Calico enforces egress on the DNAT'd master IP, so allowing only the service IP isn't
    # enough on a private cluster.
    # ========================================
    {{- if .Values.gcp.masterCidr }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ .Values.gcp.masterCidr }}
        ports:
          - 443
    {{- end }}
    
    # ========================================
    # EGRESS TO: Allowed External Endpoints
    # ========================================
    {{- $logginEnabled := .Values.networkPolicy.logging }}
    {{- $externalEndpoints := include "secure-enclave.allowedExternalEndpoints" . }}
    {{- if $externalEndpoints }}
    {{- $endpointList := splitList "," $externalEndpoints }}
    {{- range $endpoint := $endpointList }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ printf "%s/32" $endpoint }}
        ports:
          - 443
      {{- if $logginEnabled }}
      metadata:
        annotations:
          log: "true"
          log-prefix: "SETUP-MGMT-API"
          destination: "management-app"
          destination-cidr: {{ printf "%s/32" $endpoint | quote }}
          compliance: "audit-required"
      {{- end }}
    {{- end }}
    {{- end }}
    
{{- end }}
