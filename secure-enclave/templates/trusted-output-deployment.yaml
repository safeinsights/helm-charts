{{- if .Values.trustedOutputApp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.trustedOutputApp.name }}
  # namespace omitted (Helm will inject release ns)
  # namespace: {{ .Release.Namespace }}
  # namespace: {{ .Values.trustedOutputApp.namespace | default .Release.Namespace }}
  labels:
    app: {{ .Values.trustedOutputApp.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.trustedOutputApp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.trustedOutputApp.name }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Values.trustedOutputApp.image.repository }}
        # imagePullPolicy: {{ .Values.trustedOutputApp.image.pullPolicy }}
        imagePullPolicy: {{ .Values.trustedOutputApp.image.pullPolicy | default "IfNotPresent" }}
        # image: {{ .Values.trustedOutputApp.image.registry }}/{{ .Values.trustedOutputApp.image.repository }}:{{ .Values.trustedOutputApp.image.tag }}
        # Use digest if provided, otherwise tag
        {{- if .Values.trustedOutputApp.image.digest }}
        image: "{{ .Values.trustedOutputApp.image.registry }}/{{ .Values.trustedOutputApp.image.repository }}@{{ .Values.trustedOutputApp.image.digest }}"
        {{- else }}
        image: "{{ .Values.trustedOutputApp.image.registry }}/{{ .Values.trustedOutputApp.image.repository }}:{{ .Values.trustedOutputApp.image.tag }}"
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi  
        ports:
          - containerPort: {{.Values.trustedOutputApp.service.targetPort}}
        {{- if .Values.trustedOutputApp.workingDir }}
        workingDir: {{ .Values.trustedOutputApp.workingDir }}
        {{- end }}
        {{- if .Values.trustedOutputApp.command }}
        command: 
          {{- range .Values.trustedOutputApp.command }}
            - {{ . | quote }}
          {{- end }}
        {{- end}}
        env:
        {{- if .Values.trustedOutputApp.environmentVariables.httpBasicAuth }}
          - name: "HTTP_BASIC_AUTH"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.trustedOutputApp.name }}-secret
                key: http-basic-auth
        {{- end }}
        {{- if .Values.managementApp.memberId }}
          - name: "MANAGEMENT_APP_MEMBER_ID"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.trustedOutputApp.name }}-secret
                key: mgmt-app-member-id
        {{- end }}
        {{- if .Values.managementApp.endpoint.host }}
          - name: "MANAGEMENT_APP_API_URL"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.trustedOutputApp.name }}-secret
                key: mgmt-app-api-url
        {{- end }}
        {{- if .Values.managementApp.privateKey }}
          - name: "MANAGEMENT_APP_PRIVATE_KEY"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.managementApp.privateKey.secretName }}
                key: {{ .Values.managementApp.privateKey.key }}
        {{- end}}
      {{- if .Values.trustedOutputApp.image.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.trustedOutputApp.image.imagePullSecret  }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}

