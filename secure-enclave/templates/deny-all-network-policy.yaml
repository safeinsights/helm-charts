{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  annotations:
    description: "Zero-trust baseline - deny all traffic"
    version: "1.0.0"
    architecture: "fail-closed"
    security-posture: "deny-first"
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
  - Ingress
  - Egress
{{- end }}