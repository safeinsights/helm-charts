{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.trustedOutputApp.name }}-network-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.trustedOutputApp.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
    - ports: 
      - protocol: {{  .Values.trustedOutputApp.service.protocol }}
        port: {{  .Values.trustedOutputApp.service.port }}
      from:
        - podSelector:
            matchLabels:
              role: toa-access
        - podSelector:
            matchLabels:
              app: {{ .Values.setupApp.name }}
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.setupApp.environmentVariables.mgmtAppApi.port }}
      to:
        - ipBlock:
            cidr: {{ .Values.setupApp.environmentVariables.mgmtAppApi.host }}/32

{{- end }}