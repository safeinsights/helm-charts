{{- if .Values.trustedOutputApp.environmentVariables }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.trustedOutputApp.name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.trustedOutputApp.name }}
type: Opaque
data:
    {{- if .Values.trustedOutputApp.environmentVariables.httpBasicAuth }}
    http-basic-auth: {{ .Values.trustedOutputApp.environmentVariables.httpBasicAuth | b64enc }}
    {{- end }}
    {{- if .Values.managementApp.endpoint.host }}
    mgmt-app-api-url: {{ printf "%s://%s:%d" (default "https" .Values.managementApp.endpoint.protocol) .Values.managementApp.endpoint.host ((default 443 .Values.managementApp.endpoint.port) | int) | b64enc }}
    {{- end }}
    {{- if .Values.managementApp.memberId }}
    mgmt-app-member-id: {{ .Values.managementApp.memberId | b64enc }}
    {{- end }}
{{- end }}