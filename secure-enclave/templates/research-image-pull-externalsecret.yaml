{{- if and .Values.externalSecretsEnabled .Values.harbor.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-image-pull-secret
  namespace: {{ .Values.researchNamespace }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
  annotations:
    description: "Harbor registry pull credentials for research pods"
spec:
  refreshInterval: {{ .Values.harbor.externalSecret.refreshInterval | default "1h" }}
  
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "aws-sm" }}
  
  target:
    name: research-image-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {{`{
            "auths": {
              "{{ .server }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }`}}
  
  data:
    - secretKey: server
      remoteRef:
        key: {{ .Values.harbor.externalSecret.awsSecretName }}
        property: server
    
    - secretKey: username
      remoteRef:
        key: {{ .Values.harbor.externalSecret.awsSecretName }}
        property: username
    
    - secretKey: password
      remoteRef:
        key: {{ .Values.harbor.externalSecret.awsSecretName }}
        property: password
{{- end }}
