{{- if .Values.setupApp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.setupApp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.setupApp.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.setupApp.name }}
      role: toa-access
  template:
    metadata:
      labels:
        app: {{ .Values.setupApp.name }}
        role: toa-access
    spec:
      serviceAccountName: {{ .Values.setupApp.name }}-sa
      {{- if .Values.setupApp.image.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.setupApp.image.imagePullSecret  }}
      {{- end }}
      containers:
      - name: {{ .Values.setupApp.image.repository }}
        imagePullPolicy: {{ .Values.setupApp.image.pullPolicy }}
        image: {{ .Values.setupApp.image.registry }}/{{ .Values.setupApp.image.repository }}:{{ .Values.setupApp.image.tag }}  
        ports:
          - containerPort: {{ .Values.setupApp.service.targetPort  }}
        {{- if .Values.setupApp.workingDir }}
        workingDir: {{ .Values.setupApp.workingDir }}
        {{- end }}
        {{- if .Values.setupApp.command }}
        command: 
          {{- range .Values.setupApp.command }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
        env:
          - name: "DEPLOYMENT_ENVIRONMENT"
            value: "KUBERNETES"
        {{- if .Values.setupApp.environmentVariables.k8sApiServer }}
          - name: "K8S_APISERVER"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: k8s-api-server
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.k8sServiceAccountPath }}
          - name: "K8S_SERVICEACCOUNT_PATH"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: k8s-service-account-path
        {{- end }}
         {{- if .Values.managementApp.memberId }}
          - name: "MANAGEMENT_APP_MEMBER_ID"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: mgmt-app-member-id
        {{- end }}
        {{- if .Values.managementApp.endpoint.host }}
          - name: "MANAGEMENT_APP_BASE_URL"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: mgmt-app-api-url
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.pollIntervall }}
          - name: "POLL_INTERVALL"
            value: {{ .Values.setupApp.environmentVariables.pollIntervall | quote }}
        {{- end }}
          - name: "TOA_BASE_URL"
        {{- if .Values.setupApp.environmentVariables.toaApiIUrl }}
            value: {{ .Values.setupApp.environmentVariables.toaApiIUrl }}
        {{-  else }}
            value: http://{{ .Values.trustedOutputApp.name }}-svc:{{ .Values.trustedOutputApp.service.port }}
        {{- end }}
        {{- if .Values.trustedOutputApp.environmentVariables.httpBasicAuth }}
          - name: "TOA_BASIC_AUTH"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: http-basic-auth
        {{- end }}
        {{- if .Values.managementApp.privateKey }}
          - name: "MANAGEMENT_APP_PRIVATE_KEY"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.managementApp.privateKey.secretName }}
                key: {{ .Values.managementApp.privateKey.key }}
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.harborPullSecret }}
          - name: "HARBOR_PULL_SECRET"
            value: {{ .Values.setupApp.environmentVariables.harborPullSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}