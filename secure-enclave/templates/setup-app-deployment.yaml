{{- if .Values.setupApp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.setupApp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.setupApp.name }}
      role: toa-access
  template:
    metadata:
      labels:
        app: {{ .Values.setupApp.name }}
        role: toa-access
    spec:
      serviceAccountName: {{ .Values.setupApp.name }}-sa
      {{- if .Values.setupApp.image.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.setupApp.image.imagePullSecret  }}
      {{- end }}
      volumes:
        {{- if and .Values.emptyDir .Values.emptyDir.enabled }}
        - name: worktmp
          emptyDir:
            {{- if .Values.emptyDir.sizeLimit }}
            sizeLimit: {{ .Values.emptyDir.sizeLimit }}
            {{- end }}
        {{- end }}
        {{- if .Values.setupApp.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-pvc" .Values.setupApp.name) .Values.setupApp.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.volumes }}
{{ toYaml . | nindent 8 }}
        {{- end }}
      containers:
      - name: {{ .Values.setupApp.image.repository }}
        imagePullPolicy: {{ .Values.setupApp.image.pullPolicy }}
        image: {{ .Values.setupApp.image.registry }}/{{ .Values.setupApp.image.repository }}:{{ .Values.setupApp.image.tag }}  
        ports:
          - containerPort: {{ .Values.setupApp.service.targetPort  }}
        {{- if .Values.setupApp.workingDir }}
        workingDir: {{ .Values.setupApp.workingDir }}
        {{- end }}
        {{- if .Values.setupApp.command }}
        command: 
          {{- range .Values.setupApp.command }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
        env:
          - name: "DEPLOYMENT_ENVIRONMENT"
            value: "KUBERNETES"
          - name: "K8S_APISERVER"
            valueFrom:
              secretKeyRef:
                name: enclave-secret
                key: k8s-api-server
          - name: "K8S_SERVICEACCOUNT_PATH"
            valueFrom:
              secretKeyRef:
                name: enclave-secret
                key: k8s-service-account-path
        {{- if .Values.managementApp.memberId }}
          - name: "MANAGEMENT_APP_MEMBER_ID"
            value: {{ .Values.managementApp.memberId }}
        {{- end }}
        {{- if .Values.managementApp.endpoint }}
          - name: "MANAGEMENT_APP_BASE_URL"
            valueFrom:
              secretKeyRef:
                name: enclave-secret
                key: management-app-api-url
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.pollIntervall }}
          - name: "POLL_INTERVALL"
            value: {{ .Values.setupApp.environmentVariables.pollIntervall | quote }}
        {{- end }}
          - name: "TOA_BASE_URL"
            value: http://{{ .Values.trustedOutputApp.name }}-svc:{{ .Values.trustedOutputApp.service.port }}
          - name: "MANAGEMENT_APP_PRIVATE_KEY"
            valueFrom:
              secretKeyRef:
                name: enclave-secret
                key: management-app-private-key
        {{- if .Values.setupApp.environmentVariables.harborPullSecret }}
          - name: "HARBOR_PULL_SECRET"
            value: {{ .Values.setupApp.environmentVariables.harborPullSecret }}
        {{- end }}
        {{- if .Values.gcp.enabled }}
          # GCP: tell setup-app which ServiceAccount to stamp on research Jobs (Workload
          # Identity) and which BigQuery dataset/table to inject (dataorg_bq_helper.R).
          - name: "RESEARCH_SERVICE_ACCOUNT"
            value: {{ .Values.gcp.workloadIdentity.researchServiceAccountName | quote }}
          {{- if .Values.gcp.bigQuery.project }}
          - name: "DATAORG_BQ_PROJECT"
            value: {{ .Values.gcp.bigQuery.project | quote }}
          {{- end }}
          {{- if .Values.gcp.bigQuery.dataset }}
          - name: "DATAORG_BQ_DATASET"
            value: {{ .Values.gcp.bigQuery.dataset | quote }}
          {{- end }}
          {{- if .Values.gcp.bigQuery.table }}
          - name: "DATAORG_BQ_TABLE"
            value: {{ .Values.gcp.bigQuery.table | quote }}
          {{- end }}
          {{- if .Values.gcp.bigQuery.billingProject }}
          - name: "DATAORG_BQ_BILLING_PROJECT"
            value: {{ .Values.gcp.bigQuery.billingProject | quote }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
