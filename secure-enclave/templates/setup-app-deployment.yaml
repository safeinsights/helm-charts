{{- if .Values.setupApp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.setupApp.name }}
  # namespace omitted (Helm will inject release ns)
  namespace: {{ .Release.Namespace }}
  # namespace: {{ .Values.setupApp.namespace | default .Release.Namespace }}
  labels:
    app: {{ .Values.setupApp.name }}
    app.kubernetes.io/name: {{ .Values.setupApp.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.setupApp.name }}
      app.kubernetes.io/name: {{ .Values.setupApp.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      role: toa-access
  template:
    metadata:
      labels:
        app: {{ .Values.setupApp.name }}
        app.kubernetes.io/name: {{ .Values.setupApp.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        role: toa-access
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.setupApp.name }}-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.emptyDir.enabled }}
      volumes:
        - name: scratch
          emptyDir:
            {{- with .Values.emptyDir.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
      {{- end }}
      {{- if .Values.setupApp.image.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.setupApp.image.imagePullSecret  }}
      {{- end }}

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Values.setupApp.name | default "setup-app" }}
                  app.kubernetes.io/name: {{ .Values.setupApp.name | default "setup-app" }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname

      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey | default "topology.kubernetes.io/zone" | quote }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.setupApp.name }}
              app.kubernetes.io/name: {{ .Values.setupApp.name | default "setup-app" }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}


      containers:
      - name: {{ .Values.setupApp.image.repository }}
        imagePullPolicy: {{ .Values.setupApp.image.pullPolicy | default "Always" | quote }}
        # image: {{ .Values.setupApp.image.registry }}/{{ .Values.setupApp.image.repository }}:{{ .Values.setupApp.image.tag }}  
        # Use digest if provided, otherwise tag
        {{- if .Values.setupApp.image.digest }}
        image: "{{ .Values.setupApp.image.registry }}/{{ .Values.setupApp.image.repository }}@{{ .Values.setupApp.image.digest }}"
        {{- else }}
        image: "{{ .Values.setupApp.image.registry }}/{{ .Values.setupApp.image.repository }}:{{ .Values.setupApp.image.tag }}"
        {{- end }}
        ports:
          - containerPort: {{ .Values.setupApp.service.targetPort  }}
        {{- if .Values.setupApp.workingDir }}
        workingDir: {{ .Values.setupApp.workingDir }}
        {{- end }}
        {{- if .Values.setupApp.command }}
        command: 
          {{- range .Values.setupApp.command }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
        env:
          - name: "DEPLOYMENT_ENVIRONMENT"
            value: "KUBERNETES"
        {{- if .Values.setupApp.environmentVariables.k8sApiServer }}
          - name: "K8S_APISERVER"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: k8s-api-server
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.k8sServiceAccountPath }}
          - name: "K8S_SERVICEACCOUNT_PATH"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: k8s-service-account-path
        {{- end }}
         {{- if .Values.managementApp.memberId }}
          - name: "MANAGEMENT_APP_MEMBER_ID"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: mgmt-app-member-id
        {{- end }}
        {{- if .Values.managementApp.endpoint.host }}
          - name: "MANAGEMENT_APP_BASE_URL"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: mgmt-app-api-url
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.pollIntervall }}
          - name: "POLL_INTERVALL"
            value: {{ .Values.setupApp.environmentVariables.pollIntervall | quote }}
        {{- end }}
          - name: "TOA_BASE_URL"
        {{- if .Values.setupApp.environmentVariables.toaApiIUrl }}
            value: {{ .Values.setupApp.environmentVariables.toaApiIUrl }}
        {{-  else }}
            value: http://{{ .Values.trustedOutputApp.name }}-svc:{{ .Values.trustedOutputApp.service.port }}
        {{- end }}
        {{- if .Values.trustedOutputApp.environmentVariables.httpBasicAuth }}
          - name: "TOA_BASIC_AUTH"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.setupApp.name }}-secret
                key: http-basic-auth
        {{- end }}
        {{- if .Values.managementApp.privateKey }}
          - name: "MANAGEMENT_APP_PRIVATE_KEY"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.managementApp.privateKey.secretName }}
                key: {{ .Values.managementApp.privateKey.key }}
        {{- end }}
        {{- if .Values.setupApp.environmentVariables.harborPullSecret }}
          - name: "HARBOR_PULL_SECRET"
            value: {{ .Values.setupApp.environmentVariables.harborPullSecret }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.emptyDir.enabled }}
        volumeMounts:
          - name: scratch
            mountPath: {{ default "/tmp" .Values.emptyDir.mountPath | quote }}
        {{- end }}

        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path | default "/healthz" | quote }}
            port: {{ .Values.setupApp.service.targetPort }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 2 }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold | default 3 }}

        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path | default "/livez" | quote }}
            port: {{ .Values.setupApp.service.targetPort }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 10 }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 2 }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold | default 3 }}

        # Optional but recommended if app is slow to boot:
        startupProbe:
          httpGet:
            path: {{ .Values.probes.startup.path | default "/healthz" | quote }}
            port: {{ .Values.setupApp.service.targetPort }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold | default 30 }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds | default 5 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
