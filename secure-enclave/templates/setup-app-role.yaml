apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name:  {{ .Values.setupApp.name }}-role
  # namespace omitted (Helm will inject release ns)
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]

  {{- with .Values.setupApp.rbac.allowedSecretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["get"]
  {{- end }}

  {{- if .Values.setupApp.rbac.allowJobCreate }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  {{- else }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  {{- end }}
