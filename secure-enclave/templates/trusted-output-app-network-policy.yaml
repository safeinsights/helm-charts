{{- if .Values.networkPolicy.enabled }}
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.trustedOutputApp.name }}-network-policy
  annotations:
    description: "Trusted Output App - result submission and approval"
    version: "3.0.0-self-contained"
    architecture: "self-contained-dns"
    compliance: "management-api-audit-enabled"
    {{- if .Values.networkPolicy.logging }}
    logging: "enabled"
    {{- end }}
spec:
  selector: app == "{{ .Values.trustedOutputApp.name }}"
  order: 10
  types:
    - Ingress
    - Egress
  
  # ========================================
  # INGRESS: From admin namespace + research pods
  # ========================================
  ingress:
    # From admin namespace (setup-app, other TOA pods)
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name in { "{{ .Release.Namespace }}" }
      destination:
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort | default 3002 }}
    
    # From research namespace (toa-access pods only)
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name in { "{{ .Release.Namespace }}" }
        selector: role == "toa-access"
      destination:
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort | default 3002 }}
  
  egress:
    {{- include "secure-enclave.dnsEgressRules" . | nindent 4 }}

    # ========================================
    # EGRESS TO: TOA-to-TOA (service mesh)
    # ========================================
    - action: Allow
      protocol: TCP
      destination:
        selector: app == "{{ .Values.trustedOutputApp.name }}"
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort }}

    # ========================================
    # EGRESS TO: Allowed External Endpoints
    # ========================================
    {{- $logginEnabled := .Values.networkPolicy.logging }}
    {{- $externalEndpoints := include "secure-enclave.allowedExternalEndpoints" . }}
    {{- if $externalEndpoints }}
    {{- $endpointList := splitList "," $externalEndpoints }}
    {{- range $endpoint := $endpointList }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ printf "%s/32" $endpoint }}
        ports:
          - 443
      {{- if $logginEnabled }}
      metadata:
        annotations:
          log: "true"
          log-prefix: "TOA-MGMT-API"
          destination: "management-app"
          destination-cidr: {{ printf "%s/32" $endpoint | quote }}
          compliance: "audit-required"
      {{- end }}
    {{- end }}
    {{- end }}

{{- end }}
