{{- if .Values.networkPolicy.enabled }}
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.trustedOutputApp.name }}-network-policy
  namespace: {{ .Values.adminNamespace | default "enclave-admin-ns" }}
  annotations:
    description: "Trusted Output App - result submission and approval"
    version: "3.0.0-self-contained"
    architecture: "self-contained-dns"
    compliance: "management-api-audit-enabled"
    {{- if .Values.calicoNetworkPolicy.logging.enableManagementApiCalls }}
    logging: "enabled"
    {{- end }}
spec:
  selector: app == "{{ .Values.trustedOutputApp.name }}"
  order: 10
  types:
    - Ingress
    - Egress
  
  # ========================================
  # INGRESS: From admin namespace + research pods
  # ========================================
  ingress:
    # From admin namespace (setup-app, other TOA pods)
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == "{{ .Values.adminNamespace | default "enclave-admin-ns" }}"
      destination:
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort | default 3002 }}
    
    # From research namespace (toa-access pods only)
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == "{{ .Values.researchNamespace | default "enclave-research-ns" }}"
        selector: role == "toa-access"
      destination:
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort | default 3002 }}
  
  egress:
    # ========================================
    # EXCEPTION 1: DNS Resolution (UDP - Primary)
    # ========================================
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "kube-system"
        selector: k8s-app == "kube-dns"
        ports:
          - 53
    
    # ========================================
    # EXCEPTION 2: DNS Resolution (TCP - Fallback)
    # ========================================
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "kube-system"
        selector: k8s-app == "kube-dns"
        ports:
          - 53
    
    # ========================================
    # EGRESS TO: TOA-to-TOA (service mesh)
    # ========================================
    - action: Allow
      protocol: TCP
      destination:
        selector: app == "{{ .Values.trustedOutputApp.name }}"
        ports:
          - {{ .Values.trustedOutputApp.service.targetPort | default 3002 }}
    
    # ========================================
    # EGRESS TO: Management App (External via NAT)
    # ========================================
    {{- if .Values.managementApp.networkPolicy.egressCidrs }}
    {{- range $idx, $rule := .Values.managementApp.networkPolicy.egressCidrs }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ .cidr }}
        ports:
          - {{ .port | default $.Values.managementApp.endpoint.port | default 443 }}
      {{- if $.Values.calicoNetworkPolicy.logging.enableManagementApiCalls }}
      metadata:
        annotations:
          log: "true"
          log-prefix: "TOA-MGMT-API-{{ $idx }}"
          destination: "management-app"
          destination-cidr: "{{ .cidr }}"
          compliance: "audit-required"
      {{- end }}
    {{- end }}
    {{- else }}
    # Fallback: Allow HTTPS to management app
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - 0.0.0.0/0
        ports:
          - {{ .Values.managementApp.endpoint.port | default 443 }}
      {{- if .Values.calicoNetworkPolicy.logging.enableManagementApiCalls }}
      metadata:
        annotations:
          log: "true"
          log-prefix: "TOA-MGMT-API-FALLBACK"
          destination: "management-app"
          compliance: "audit-required"
      {{- end }}
    {{- end }}
    
    # ========================================
    # EGRESS TO: Kubernetes API (optional)
    # ========================================
    {{- if and .Values.trustedOutputApp.networkPolicy.allowK8sApiEgress .Values.trustedOutputApp.networkPolicy.k8sApiCidr }}
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - {{ .Values.trustedOutputApp.networkPolicy.k8sApiCidr }}
        ports:
          - 443
    {{- end }}
{{- end }}
