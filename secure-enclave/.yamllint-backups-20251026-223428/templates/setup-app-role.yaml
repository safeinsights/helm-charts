apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.setupApp.name }}-role
  namespace: {{ .Values.adminNamespace | default "enclave-admin-ns" }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
rules:
# Read-only pod metadata in admin ns
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch"]

# Read-only service discovery + config + events (core API)
- apiGroups: [""]
  resources: ["services","endpoints","configmaps","events"]
  verbs: ["get","list","watch"]

# Read-only events via events.k8s.io (some clusters surface events there)
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get","list","watch"]

# Read-only, name-scoped secrets (least privilege; omitted entirely if list empty)
{{- with .Values.setupApp.rbac.allowedSecretNames }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
{{ toYaml . | indent 4 }}
  verbs: ["get"]
{{- end }}

# Jobs: read-only by default; optionally allow create/delete via values
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get","list","watch"]
  {{- if .Values.setupApp.rbac.allowJobCreate | default false }}
  - "create"
  {{- end }}
  {{- if .Values.setupApp.rbac.allowJobDelete | default false }}
  - "delete"
  {{- end }}

