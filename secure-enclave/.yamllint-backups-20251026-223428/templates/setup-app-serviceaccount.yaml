{{- if .Values.setupApp.serviceAccount.create }}
apiVersion: v1                                                       
kind: ServiceAccount                                                 
metadata:
  name: {{ default (printf "%s-sa" .Values.setupApp.name) .Values.setupApp.serviceAccount.name }}
  namespace: {{ .Values.adminNamespace | default "enclave-admin-ns" }}                                
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}             
  {{- with .Values.setupApp.serviceAccount.annotations }}
  annotations:                                                       
{{ toYaml . | indent 4 }}                                            
  {{- end }}
automountServiceAccountToken: {{ .Values.setupApp.serviceAccount.automountServiceAccountToken | default true }}
{{- with .Values.setupApp.imagePullSecrets }}
imagePullSecrets:                                                    
  {{- range . }}
  - name: {{ . }}                                                    
  {{- end }}
{{- end }}
{{- with .Values.setupApp.serviceAccount.secrets }}
secrets:                                                             
  {{- range . }}
  - name: {{ . }}                                                   
  {{- end }}
{{- end }}
{{- end }}
