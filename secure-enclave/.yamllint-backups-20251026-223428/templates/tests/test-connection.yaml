apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "secure-enclave.fullname" . }}-test-connection"
  namespace: {{ .Values.adminNamespace | default .Release.Namespace }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
    test-connection: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Pod-level hardening
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never

  # Scratch space for read-only rootfs
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi

  containers:
    - name: curl
      image: curlimages/curl:8.9.1
      imagePullPolicy: Always
      command: ["sh","-c"]
      args:
        - >
          curl -fsS --connect-timeout 5 --max-time 10
          http://{{ .Values.setupApp.name }}-svc:{{ .Values.setupApp.service.port }}/healthz/ready
      # Container-level hardening
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      # Resources incl. ephemeral-storage (requests + limits)
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 256Mi
