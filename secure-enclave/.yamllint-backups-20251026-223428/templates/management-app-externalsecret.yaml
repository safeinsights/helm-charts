{{- if .Values.externalSecretsEnabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: management-app-credentials
  namespace: {{ .Values.adminNamespace | default "enclave-admin-ns" }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.managementApp.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "aws-sm" }}
  target:
    name: management-app-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # HTTP Basic Authentication credentials
    - secretKey: MGMT_BASIC_AUTH
      remoteRef:
        key: {{ .Values.managementApp.externalSecret.awsSecretName }}
        property: managementBasicAuth
    
    # Member/Organization ID
    - secretKey: MGMT_APP_MEMBER_ID
      remoteRef:
        key: {{ .Values.managementApp.externalSecret.awsSecretName }}
        property: managementmemberId
    
    # Optional: Private Key for cryptographic operations
    - secretKey: MGMT_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.managementApp.externalSecret.awsSecretName }}
        property: privateKey
{{- end }}
