{{- if .Values.trustedOutputApp.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.trustedOutputApp.name }}-pvc
  namespace: {{ .Values.adminNamespace | default "enclave-admin-ns" }}
  labels:
    {{- include "secure-enclave.labels" . | nindent 4 }}
  {{- with .Values.trustedOutputApp.persistence.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  accessModes:
{{ toYaml .Values.trustedOutputApp.persistence.accessModes | indent 4 }}
  storageClassName: {{ .Values.trustedOutputApp.persistence.storageClassName | quote }}
  {{- with .Values.trustedOutputApp.persistence.volumeMode }}
  volumeMode: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.trustedOutputApp.persistence.pvcSize | quote }}
{{- end }}


