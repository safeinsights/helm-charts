{{- if .Values.audit.placeholders.research }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-placeholder
  namespace: {{ .Values.researchNamespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      role: {{ .Values.researchContainer.name | default "research" }}
  template:
    metadata:
      labels:
        role: {{ .Values.researchContainer.name | default "research" }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      priorityClassName: {{ .Values.priorityClassName | default "system-cluster-critical" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              role: {{ .Values.researchContainer.name | default "research" }}
      containers:
        - name: nop
          image: public.ecr.aws/docker/library/busybox:1.36.1   # pin tag (no "latest")
          imagePullPolicy: Always
          command: ["sh","-c","sleep 3600"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
{{- end }}

