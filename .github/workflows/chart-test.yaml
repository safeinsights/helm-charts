name: "Test using kind and chart-testing tool"
on:
  pull_request:
    paths:
    - "secure-enclave/**"
    - "kind-config*.yaml"
    - "ct-config.yaml"
    - ".github/workflows/chart-test.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@2.0.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (lint)
        run: ct lint --config ct-config.yaml

  install-test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        kubernetesVersion: ["v1.28.0"]
        calico: ["enabled", "disabled"]
    name: install-test (${{ matrix.calico }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster (Calico CNI)
        if: matrix.calico == 'enabled'
        uses: helm/kind-action@v1.12.0
        with:
          node_image: "kindest/node:${{ matrix.kubernetesVersion }}"
          config: ${{ github.workspace }}/kind-config-calico.yaml

      - name: Create kind cluster (default CNI)
        if: matrix.calico == 'disabled'
        uses: helm/kind-action@v1.12.0
        with:
          node_image: "kindest/node:${{ matrix.kubernetesVersion }}"
          config: ${{ github.workspace }}/kind-config.yaml

      - name: Install Calico
        if: matrix.calico == 'enabled'
        run: |
          helm repo add projectcalico https://docs.tigera.io/calico/charts
          helm repo update
          helm install calico projectcalico/tigera-operator \
            --version v3.31.1 \
            --namespace tigera-operator \
            --create-namespace \
            --wait --timeout 5m

      - name: Wait for Calico to be ready
        if: matrix.calico == 'enabled'
        run: |
          echo "Waiting for calico-system namespace to be created..."
          until kubectl get namespace calico-system > /dev/null 2>&1; do
            echo "Namespace calico-system not found yet, retrying..."
            sleep 5
          done
          echo "Waiting for calico-node pods to exist..."
          until kubectl get pods -l k8s-app=calico-node -n calico-system 2>/dev/null | grep -q calico-node; do
            echo "calico-node pods not found yet, retrying..."
            sleep 5
          done
          echo "Waiting for calico-node pods to be ready..."
          kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n calico-system --timeout=180s
          kubectl get daemonset calico-node -n calico-system

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A

      - name: Install chart
        run: |
          helm install secure-enclave ./secure-enclave \
            --namespace secure-enclave-test \
            --create-namespace \
            --set managementApp.memberId=test \
            --set networkPolicy.enabled=${{ matrix.calico == 'enabled' }} \
            --wait --timeout 5m --debug

      - name: Run helm tests
        run: helm test secure-enclave --namespace secure-enclave-test --timeout 3m

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -A
          echo "=== Events ==="
          kubectl get events --namespace secure-enclave-test --sort-by='.lastTimestamp'
          echo "=== Describe failed pods ==="
          kubectl describe pods --namespace secure-enclave-test

      - name: Cleanup
        if: always()
        run: |
          helm uninstall secure-enclave --namespace secure-enclave-test --ignore-not-found
          kubectl delete namespace secure-enclave-test --ignore-not-found
